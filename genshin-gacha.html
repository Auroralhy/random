<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>祈愿 · 随机抽卡</title>
<style>
  :root {
    --gold: #f0c060;
    --gold-glow: rgba(240,192,96,.5);
    --purple: #c882ff;
    --purple-glow: rgba(200,130,255,.45);
    --blue: #5b9fff;
    --blue-glow: rgba(91,159,255,.35);
    --bg: #0a0a14;
    --card: #12122a;
    --text: #d4d4e8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }
  .stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .star {
    position: absolute; background: #fff; border-radius: 50%;
    animation: twinkle var(--dur) ease-in-out infinite;
    animation-delay: var(--delay); opacity: 0;
  }
  @keyframes twinkle {
    0%,100% { opacity: .15; transform: scale(1); }
    50% { opacity: .9; transform: scale(1.8); }
  }
  .shooting-star {
    position: fixed; width: 3px; height: 3px; background: #fff;
    border-radius: 50%; pointer-events: none; z-index: 50;
    box-shadow: 0 0 6px 2px rgba(255,255,255,.7), 0 0 20px 6px rgba(240,192,96,.4);
  }
  .shooting-star::after {
    content: ''; position: absolute; top: 50%; right: 100%;
    width: 80px; height: 1.5px;
    background: linear-gradient(to left, #fff, transparent);
    transform: translateY(-50%);
  }
  .shooting-star.fly { animation: shoot .7s cubic-bezier(.25,.1,.25,1) forwards; }
  @keyframes shoot {
    0% { transform: translate(0,0) rotate(-35deg); opacity: 1; }
    70% { opacity: 1; }
    100% { transform: translate(-600px,400px) rotate(-35deg); opacity: 0; }
  }

  .app {
    position: relative; z-index: 1; max-width: 480px;
    margin: 0 auto; padding: 32px 20px 60px;
    display: flex; flex-direction: column; align-items: center; gap: 24px;
  }
  .title {
    font-size: 26px; font-weight: 700; letter-spacing: .04em;
    background: linear-gradient(135deg, var(--gold), #f5d78c, var(--gold));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .subtitle { font-size: 13px; color: #6a6a8a; letter-spacing: .12em; margin-top: -16px; }

  .wish-orbit {
    position: relative; width: 240px; height: 240px;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .wish-orbit::before {
    content: ''; position: absolute; inset: 0; border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,.08);
    animation: orbit-rotate 20s linear infinite;
  }
  .wish-orbit::after {
    content: ''; position: absolute; inset: 30px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,.06);
    animation: orbit-rotate 14s linear infinite reverse;
  }
  @keyframes orbit-rotate { to { transform: rotate(360deg); } }
  .wish-core { position: relative; width: 120px; height: 120px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .wish-core-inner {
    width: 100%; height: 100%; border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, rgba(240,192,96,.25), rgba(90,60,180,.15) 50%, transparent 70%);
    box-shadow: 0 0 60px rgba(240,192,96,.2), 0 0 120px rgba(140,100,220,.12), inset 0 0 40px rgba(240,192,96,.1);
    transition: all .5s; display: flex; align-items: center; justify-content: center;
  }
  .wish-core-inner .glyph {
    font-size: 52px; color: rgba(240,192,96,.8);
    transition: all .4s;
    filter: drop-shadow(0 0 12px rgba(240,192,96,.4));
  }
  .wish-orbit:hover .wish-core-inner {
    box-shadow: 0 0 90px var(--gold-glow), 0 0 180px rgba(140,100,220,.2), inset 0 0 60px var(--gold-glow);
  }
  .wish-orbit:hover .glyph { color: #f5d78c; transform: scale(1.08); }
  .wish-orbit:active .wish-core-inner { transform: scale(.94); box-shadow: 0 0 140px rgba(240,192,96,.6), 0 0 240px rgba(180,120,255,.35); }
  .wish-orbit.charging .wish-core-inner {
    box-shadow: 0 0 140px rgba(240,192,96,.7), 0 0 220px rgba(180,130,255,.4), inset 0 0 70px rgba(240,192,96,.3);
    animation: charge-pulse .15s ease-in-out 6;
  }
  @keyframes charge-pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.06)} }

  .orbit-particle {
    position: absolute; width: 4px; height: 4px; background: var(--gold);
    border-radius: 50%; box-shadow: 0 0 8px var(--gold-glow);
    animation: particle-orbit var(--dur) linear infinite;
    animation-delay: var(--delay);
  }
  @keyframes particle-orbit {
    0% { transform: rotate(0deg) translateX(110px) rotate(0deg); }
    100% { transform: rotate(360deg) translateX(110px) rotate(-360deg); }
  }

  .wish-hint { font-size: 14px; color: #5a5a7a; letter-spacing: .08em; }

  .result-overlay {
    position: fixed; inset: 0; background: rgba(4,4,16,.85);
    z-index: 100; display: flex; align-items: center; justify-content: center;
    animation: overlay-in .25s ease; flex-direction: column; gap: 8px;
  }
  @keyframes overlay-in { 0%{opacity:0} 100%{opacity:1} }
  .result-card {
    background: linear-gradient(160deg, #1a1a38, #12122a);
    border-radius: 20px; padding: 36px 32px; text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    min-width: 280px;
    animation: card-pop .5s cubic-bezier(.34,1.56,.64,1);
    position: relative; overflow: hidden;
  }
  @keyframes card-pop { 0%{transform:scale(.4) translateY(60px);opacity:0} 100%{transform:scale(1) translateY(0);opacity:1} }
  .result-card.gold { border:2px solid rgba(240,192,96,.4); box-shadow:0 0 60px var(--gold-glow),0 0 120px rgba(240,192,96,.15),0 0 200px rgba(240,192,96,.08); }
  .result-card.purple { border:2px solid rgba(200,130,255,.4); box-shadow:0 0 50px var(--purple-glow),0 0 100px rgba(200,130,255,.12); }
  .result-card.blue { border:1.5px solid rgba(91,159,255,.3); box-shadow:0 0 30px var(--blue-glow); }

  .result-stars { display: flex; gap: 3px; font-size: 22px; animation: stars-pop .7s .2s cubic-bezier(.34,1.56,.64,1) both; }
  @keyframes stars-pop { 0%{transform:scale(0);opacity:0} 100%{transform:scale(1);opacity:1} }
  .result-stars .s { display: inline-block; animation: star-pop .5s var(--d) cubic-bezier(.34,1.56,.64,1) both; }
  @keyframes star-pop { 0%{transform:scale(0) rotate(-30deg)} 100%{transform:scale(1) rotate(0deg)} }

  .result-name { font-size: 28px; font-weight: 700; letter-spacing: -.01em; animation: name-reveal .6s .35s ease both; }
  @keyframes name-reveal { 0%{opacity:0;transform:translateY(12px)} 100%{opacity:1;transform:translateY(0)} }
  .result-rarity-label { font-size: 13px; letter-spacing: .15em; padding: 3px 14px; border-radius: 20px; font-weight: 500; }
  .gold .result-rarity-label { background: rgba(240,192,96,.15); color: var(--gold); }
  .purple .result-rarity-label { background: rgba(200,130,255,.15); color: var(--purple); }
  .blue .result-rarity-label { background: rgba(91,159,255,.15); color: var(--blue); }

  .result-close {
    margin-top: 6px; font-size: 13px; color: #6a6a8a; cursor: pointer;
    padding: 10px 32px; border: 1px solid rgba(255,255,255,.1); border-radius: 24px;
    background: transparent; color: #8a8aaa; transition: all .2s;
  }
  .result-close:hover { border-color: rgba(255,255,255,.25); color: #ccc; }

  .spark {
    position: fixed; pointer-events: none; z-index: 110; border-radius: 50%;
    animation: spark-burst .9s ease-out forwards;
  }
  @keyframes spark-burst { 0%{transform:translate(0,0) scale(1);opacity:1} 100%{transform:translate(var(--sx),var(--sy)) scale(0);opacity:0} }

  .info-bar { display: flex; gap: 20px; font-size: 13px; color: #5a5a7a; flex-wrap: wrap; justify-content: center; }
  .info-bar .val { color: #c0c0d8; font-weight: 600; margin-left: 2px; }
  .info-bar .val.gold-text { color: var(--gold); }

  .config-toggle { font-size: 13px; color: #5a5a7a; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: color .2s; }
  .config-toggle:hover { color: #999; }
  .config-panel {
    width: 100%; background: var(--card); border: 1px solid rgba(255,255,255,.06);
    border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 12px;
  }
  .config-panel.hidden { display: none; }

  .mode-tabs { display: flex; gap: 6px; background: #0a0a1a; border-radius: 12px; padding: 4px; }
  .mode-tab {
    flex: 1; border: none; background: transparent; color: #6a6a8a;
    font-size: 13px; font-weight: 600; padding: 10px 8px; border-radius: 10px;
    cursor: pointer; font-family: inherit; transition: all .2s; white-space: nowrap;
  }
  .mode-tab:hover { color: #aaa; }
  .mode-tab.active { background: #1a1a38; color: #f0c060; box-shadow: 0 0 12px rgba(240,192,96,.1); }
  .mode-panel { display: flex; flex-direction: column; gap: 10px; }
  .mode-panel.hidden { display: none; }
  .panel-hint { font-size: 12px; color: #5a5a7a; line-height: 1.5; }

  .quick-add-row { display: flex; gap: 8px; }
  .quick-input {
    flex: 1; background: #0a0a1a; border: 1px solid rgba(255,255,255,.08);
    border-radius: 10px; color: #c0c0d8; font-size: 14px; padding: 10px 14px; font-family: inherit;
  }
  .quick-input:focus { outline: none; border-color: rgba(240,192,96,.3); }
  .quick-input::placeholder { color: #3a3a5a; }
  .tag-cloud { display: flex; flex-wrap: wrap; gap: 8px; min-height: 10px; }
  .tag-item {
    display: inline-flex; align-items: center; gap: 6px;
    background: #1a1a38; border: 1px solid rgba(255,255,255,.08);
    border-radius: 8px; padding: 5px 10px; font-size: 13px; color: #c0c0d8;
    animation: fade-in .2s ease;
  }
  .tag-item .tag-close { cursor: pointer; color: #6a6a8a; font-size: 15px; line-height: 1; }
  .tag-item .tag-close:hover { color: #ff5e57; }
  @keyframes fade-in { 0%{opacity:0;transform:translateY(-4px)} 100%{opacity:1;transform:translateY(0)} }

  textarea {
    width: 100%; background: #0a0a1a; border: 1px solid rgba(255,255,255,.08);
    border-radius: 10px; color: #c0c0d8; font-size: 14px; line-height: 1.7;
    padding: 12px; resize: vertical; min-height: 80px; font-family: inherit;
  }
  textarea:focus { outline: none; border-color: rgba(240,192,96,.3); }
  textarea::placeholder { color: #3a3a5a; }

  .weight-list { display: flex; flex-direction: column; gap: 8px; }
  .weight-row {
    display: flex; align-items: center; gap: 10px;
    background: #0a0a1a; border-radius: 10px; padding: 8px 12px;
  }
  .weight-row input[type="text"] {
    flex: 1; min-width: 0; background: transparent; border: none;
    color: #c0c0d8; font-size: 14px; font-family: inherit; padding: 4px 0;
  }
  .weight-row input[type="text"]:focus { outline: none; }
  .weight-row input[type="text"]::placeholder { color: #3a3a5a; }
  .weight-row input[type="range"] { flex: 2; accent-color: var(--gold); }
  .weight-row .weight-val {
    font-size: 14px; font-weight: 600; color: #f0c060; min-width: 42px;
    text-align: right;
    font-family: "JetBrains Mono","SF Mono",monospace;
    font-variant-numeric: tabular-nums;
  }
  .weight-row .row-del {
    background: none; border: none; color: #5a5a7a; font-size: 16px;
    cursor: pointer; padding: 2px 6px; line-height: 1;
  }
  .weight-row .row-del:hover { color: #ff5e57; }

  .weight-bar-wrap { background: #0a0a1a; border-radius: 10px; padding: 12px; }
  .weight-bar-chart { display: flex; gap: 3px; height: 28px; align-items: flex-end; border-radius: 6px; overflow: hidden; }
  .weight-bar-seg { height: 100%; transition: width .3s, background .3s; min-width: 2px; }

  .star-pool-section { border: 1px solid rgba(255,255,255,.06); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .star-pool-section.gold-border { border-color: rgba(240,192,96,.25); }
  .star-pool-section.purple-border { border-color: rgba(200,130,255,.2); }
  .star-pool-section.blue-border { border-color: rgba(91,159,255,.15); }
  .star-pool-label { font-size: 13px; font-weight: 600; letter-spacing: .04em; color: #8a8aaa; }
  .star-pool-section.gold-border .star-pool-label { color: #f0c060; }
  .star-pool-section.purple-border .star-pool-label { color: #c882ff; }
  .star-pool-section.blue-border .star-pool-label { color: #5b9fff; }
  .star-textarea { min-height: 48px !important; font-size: 13px !important; }
  .star-textarea.gold-textarea:focus { border-color: rgba(240,192,96,.4) !important; }
  .star-textarea.purple-textarea:focus { border-color: rgba(200,130,255,.35) !important; }
  .star-textarea.blue-textarea:focus { border-color: rgba(91,159,255,.3) !important; }

  .preset-section { border-top: 1px solid rgba(255,255,255,.06); padding-top: 14px; display: flex; flex-direction: column; gap: 10px; }
  .preset-header { display: flex; justify-content: space-between; align-items: baseline; }
  .preset-title { font-size: 13px; color: #8a8aaa; font-weight: 600; letter-spacing: .04em; }
  .preset-save-row { display: flex; gap: 8px; }
  .preset-list { display: flex; flex-wrap: wrap; gap: 8px; }
  .preset-chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: #0a0a1a; border: 1px solid rgba(255,255,255,.06);
    border-radius: 8px; padding: 6px 12px; font-size: 13px;
    color: #c0c0d8; cursor: pointer; transition: all .15s;
  }
  .preset-chip:hover { border-color: rgba(240,192,96,.3); background: #12122a; }
  .preset-chip .preset-mode-badge { font-size: 10px; padding: 1px 6px; border-radius: 10px; font-weight: 600; background: rgba(255,255,255,.06); }
  .preset-chip .preset-del { color: #5a5a7a; font-size: 14px; cursor: pointer; line-height: 1; margin-left: 2px; }
  .preset-chip .preset-del:hover { color: #ff5e57; }

  .btn {
    border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.03);
    color: #aaa; font-size: 13px; padding: 8px 16px; border-radius: 10px;
    cursor: pointer; font-family: inherit; transition: all .2s;
  }
  .btn:hover { border-color: rgba(255,255,255,.2); color: #ddd; }
  .btn-sm { font-size: 13px; padding: 6px 14px; border-radius: 8px; }
  .btn-accent { background: rgba(240,192,96,.12); border-color: rgba(240,192,96,.25); color: #f0c060; }
  .btn-accent:hover { background: rgba(240,192,96,.2); }

  .beam {
    position: fixed; left: 50%; top: -10%; width: 6px; height: 120%;
    transform: translateX(-50%); pointer-events: none; z-index: 95;
    background: linear-gradient(to bottom, transparent 0%, rgba(240,192,96,.8) 15%, rgba(240,192,96,.4) 40%, rgba(240,192,96,.1) 60%, transparent 100%);
    animation: beam-flash .6s ease-out forwards;
  }
  @keyframes beam-flash { 0%{opacity:0;height:0;top:50%} 30%{opacity:1} 60%{opacity:.6} 100%{opacity:0;height:120%;top:-10%} }

  @media (max-width: 500px) {
    .wish-orbit { width: 180px; height: 180px; }
    .wish-core { width: 90px; height: 90px; }
    .wish-core-inner .glyph { font-size: 40px; }
    @keyframes particle-orbit {
      0% { transform: rotate(0deg) translateX(82px) rotate(0deg); }
      100% { transform: rotate(360deg) translateX(82px) rotate(-360deg); }
    }
    .result-card { min-width: 240px; padding: 28px 24px; }
    .result-name { font-size: 24px; }
  }
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<div class="app">
  <div class="title">✦ 祈 愿 ✦</div>
  <div class="subtitle">W I S H</div>

  <div class="wish-orbit" id="wishOrbit" title="点击祈愿">
    <div class="wish-core">
      <div class="wish-core-inner">
        <span class="glyph">✦</span>
      </div>
    </div>
  </div>

  <div class="wish-hint">点击星辉祈愿 · 单抽</div>

  <div style="display:flex;gap:16px;align-items:center;">
    <button class="btn" id="btnSingle" style="font-size:15px;padding:10px 28px;border-color:rgba(240,192,96,.25);color:#e0c080;">✨ 祈愿</button>
  </div>

  <div class="info-bar">
    <span>总抽取 <span class="val" id="totalPulls">0</span> 次</span>
    <span>候选池 <span class="val" id="poolCount">0</span> 项</span>
  </div>

  <div class="config-toggle" id="configToggle">⚙ 卡池配置 ▾</div>
  <div class="config-panel hidden" id="configPanel">

    <div class="mode-tabs" id="modeTabs">
      <button class="mode-tab active" data-mode="equal">🎯 均等概率</button>
      <button class="mode-tab" data-mode="custom">⚖️ 自定义权重</button>
    </div>

    <div class="mode-panel" id="panelEqual">
      <div class="panel-hint">每行一个选项，所有项被选中的概率完全相同</div>
      <div class="quick-add-row">
        <input type="text" id="equalQuickInput" placeholder="输入选项名，回车添加…" class="quick-input">
        <button class="btn btn-sm" id="equalQuickAdd">+ 添加</button>
      </div>
      <textarea id="equalTextarea" placeholder="每行一个选项&#10;示例：&#10;方案A&#10;方案B&#10;方案C"></textarea>
      <div class="tag-cloud" id="equalTags"></div>
    </div>

    <div class="mode-panel hidden" id="panelCustom">
      <div class="panel-hint">拖动滑块调整每项权重，自动按比例归一化</div>
      <div class="weight-list" id="weightList"></div>
      <button class="btn btn-sm" id="addWeightRow" style="margin-top:4px;align-self:flex-start;">+ 添加选项</button>
      <div class="weight-bar-wrap" id="weightBarWrap" style="display:none;">
        <div class="panel-hint" style="margin-bottom:6px;">权重占比预览</div>
        <div class="weight-bar-chart" id="weightBarChart"></div>
      </div>
    </div>


    <div class="panel-hint" id="modeHint" style="color:#f0c060;font-weight:600;"></div>

    <div class="preset-section">
      <div class="preset-header">
        <span class="preset-title">💾 预设方案</span>
        <span class="panel-hint" style="margin:0;">自动保存到浏览器，下次打开仍在</span>
      </div>
      <div class="preset-save-row">
        <input type="text" id="presetNameInput" placeholder="输入方案名…" class="quick-input" style="flex:1;">
        <button class="btn btn-sm btn-accent" id="btnSavePreset">💾 保存当前</button>
      </div>
      <div class="preset-list" id="presetList"></div>
    </div>

    <div class="btn-row" style="display:flex;gap:8px;flex-wrap:wrap;">
      <button class="btn" id="btnLoadMilkTea">🧋 奶茶</button>
      <button class="btn" id="btnLoadFood">🍜 餐饮</button>
      <button class="btn" id="btnLoadDemo">📋 抽奖</button>
      <button class="btn" id="btnLoadSimple">📝 名单</button>
      <button class="btn btn-accent" id="btnApply">✅ 应用卡池</button>
    </div>
  </div>
</div>

<div id="overlayContainer"></div>

<script>
  let pool = [], gachaMode = 'equal';
  let totalPulls = 0;
  const TAB_BAR = ['#f0c060','#c882ff','#5b9fff','#ff9f0a','#ff5e57','#30d158','#0a84ff','#ff375f','#bf5af2','#ffd60a'];

  // Stars
  (function(){
    const c=document.getElementById('stars');
    let h='';
    for(let i=0;i<140;i++){
      const x=Math.random()*100,y=Math.random()*100,s=Math.random()*2.5+.5,dur=2+Math.random()*5,delay=Math.random()*6;
      h+=`<div class="star" style="left:${x}%;top:${y}%;width:${s}px;height:${s}px;--dur:${dur}s;--delay:${delay}s"></div>`;
    }
    c.innerHTML=h;
  })();

  function spawnShootingStar() {
    const el=document.createElement('div');
    el.className='shooting-star';
    el.style.left=(10+Math.random()*60)+'%';
    el.style.top=(-5-Math.random()*15)+'%';
    document.body.appendChild(el);
    requestAnimationFrame(()=>el.classList.add('fly'));
    el.addEventListener('animationend',()=>el.remove());
  }
  setInterval(()=>{if(Math.random()<.25)spawnShootingStar()},4000);
  spawnShootingStar();

  // Orbit particles
  (function(){
    const orbit=document.getElementById('wishOrbit');
    for(let i=0;i<8;i++){
      const p=document.createElement('div');
      p.className='orbit-particle';
      p.style.setProperty('--dur',(5+Math.random()*8)+'s');
      p.style.setProperty('--delay',(-Math.random()*10)+'s');
      orbit.prepend(p);
    }
  })();

  // Mode tabs
  document.querySelectorAll('.mode-tab').forEach(btn=>{
    btn.addEventListener('click',()=>{
      document.querySelectorAll('.mode-tab').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      gachaMode=btn.dataset.mode;
      document.querySelectorAll('.mode-panel').forEach(p=>p.classList.add('hidden'));
      document.getElementById('panel'+gachaMode.charAt(0).toUpperCase()+gachaMode.slice(1)).classList.remove('hidden');
      updateModeHint();saveLastMode();
    });
  });

  // Equal mode
  const $equalInput=document.getElementById('equalQuickInput'),$equalTA=document.getElementById('equalTextarea'),$equalTags=document.getElementById('equalTags');
  function renderEqualTags(){
    const items=$equalTA.value.split('\n').map(s=>s.trim()).filter(Boolean);
    $equalTags.innerHTML=items.map((name,i)=>`<span class="tag-item">${name}<span class="tag-close" data-idx="${i}">×</span></span>`).join('');
    $equalTags.querySelectorAll('.tag-close').forEach(btn=>{btn.addEventListener('click',()=>{const lines=$equalTA.value.split('\n').map(s=>s.trim()).filter(Boolean);lines.splice(parseInt(btn.dataset.idx),1);$equalTA.value=lines.join('\n');renderEqualTags()})});
  }
  document.getElementById('equalQuickAdd').addEventListener('click',()=>{const v=$equalInput.value.trim();if(!v)return;const lines=$equalTA.value.split('\n').map(s=>s.trim()).filter(Boolean);lines.push(v);$equalTA.value=lines.join('\n');$equalInput.value='';renderEqualTags();$equalInput.focus()});
  $equalInput.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();document.getElementById('equalQuickAdd').click()}});
  $equalTA.addEventListener('input',renderEqualTags);

  // Custom weight
  const $weightList=document.getElementById('weightList'),$weightBarChart=document.getElementById('weightBarChart'),$weightBarWrap=document.getElementById('weightBarWrap');
  function renderWeightBars(){
    const rows=[...$weightList.querySelectorAll('.weight-row')],weights=rows.map(row=>parseFloat(row.querySelector('input[type="range"]').value)||0),total=weights.reduce((s,w)=>s+w,0);
    if(total<=0||rows.length===0){$weightBarWrap.style.display='none';return}
    $weightBarWrap.style.display='block';
    $weightBarChart.innerHTML=rows.map((row,i)=>{const pct=total>0?(weights[i]/total*100):0;return`<div class="weight-bar-seg" style="width:${Math.max(pct,1)}%;background:${TAB_BAR[i%TAB_BAR.length]}" title="${row.querySelector('input[type=text]').value||'?'}: ${pct.toFixed(1)}%"></div>`}).join('');
  }
  function addWeightRow(name='',weight=10){
    const row=document.createElement('div');row.className='weight-row';
    row.innerHTML=`<input type="text" value="${name}" placeholder="选项名…" class="weight-name"><input type="range" min="0" max="100" value="${weight}" step="1" class="weight-slider"><span class="weight-val">${weight}</span><button class="row-del" title="删除">×</button>`;
    row.querySelector('.weight-slider').addEventListener('input',function(){row.querySelector('.weight-val').textContent=this.value;renderWeightBars()});
    row.querySelector('.weight-name').addEventListener('input',renderWeightBars);
    row.querySelector('.row-del').addEventListener('click',()=>{row.remove();renderWeightBars();if($weightList.children.length===0)addWeightRow()});
    $weightList.appendChild(row);renderWeightBars();
  }
  document.getElementById('addWeightRow').addEventListener('click',()=>addWeightRow('',10));

  // Pool
  function parsePool(){
    if(gachaMode==='equal')return $equalTA.value.split('\n').map(s=>s.trim()).filter(Boolean).map(name=>({name}));
    if(gachaMode==='custom'){
      return [...$weightList.querySelectorAll('.weight-row')].map(row=>({name:row.querySelector('input[type="text"]').value.trim()||'(未命名)',weight:parseFloat(row.querySelector('input[type="range"]').value)||0})).filter(it=>it.weight>0);
    }
    return[];
  }
  function applyPool(){
    pool=parsePool();
    if(pool.length===0){gachaMode='equal';$equalTA.value='选项A\n选项B\n选项C';renderEqualTags();pool=parsePool()}
    updateModeHint();updateCounters();saveLastConfig();
  }
  function updateCounters(){
    document.getElementById('totalPulls').textContent=totalPulls;
    document.getElementById('poolCount').textContent=pool.length;
  }
  function updateModeHint(){
    const hint=document.getElementById('modeHint'),pp=parsePool(),total=pp.reduce((s,it)=>s+(it.weight||0),0);
    if(gachaMode==='equal')hint.textContent=pp.length>0?`当前模式：均等概率 — ${pp.length} 项，每项 ${(100/pp.length).toFixed(1)}%`:'当前模式：均等概率 — 请添加选项';
    else hint.textContent=pp.length>0?`当前模式：自定义权重 — ${pp.length} 项，权重合计 ${total.toFixed(0)}（自动归一化）`:'当前模式：自定义权重 — 请添加选项';
  }

  // Roll
  function weightedRandom(items){const total=items.reduce((s,it)=>s+(it.weight||0),0);if(total<=0)return items[Math.floor(Math.random()*items.length)];let r=Math.random()*total;for(const it of items){r-=it.weight||0;if(r<=0)return it}return items[items.length-1]}
  function gachaRoll(){
    if(pool.length===0)return null;
    if(gachaMode==='equal')return pool[Math.floor(Math.random()*pool.length)];
    return weightedRandom(pool);
  }

  function burstSparks(x,y){
    const colors=['#f0c060','#c882ff','#5b9fff','#ff9f0a','#ff5e57','#30d158','#0a84ff'];
    for(let i=0;i<30;i++){const el=document.createElement('div');el.className='spark';el.style.left=x+'px';el.style.top=y+'px';el.style.width=(2+Math.random()*5)+'px';el.style.height=el.style.width;el.style.background=colors[Math.floor(Math.random()*colors.length)];el.style.boxShadow=`0 0 ${6+Math.random()*10}px`+el.style.background;const angle=Math.random()*Math.PI*2,dist=60+Math.random()*180;el.style.setProperty('--sx',Math.cos(angle)*dist+'px');el.style.setProperty('--sy',Math.sin(angle)*dist-40+'px');document.body.appendChild(el);el.addEventListener('animationend',()=>el.remove())}
  }

  function showResult(item,x,y){
    const container=document.getElementById('overlayContainer');
    const overlay=document.createElement('div');overlay.className='result-overlay';
    const card=document.createElement('div');card.className='result-card gold';
    const starsDiv=document.createElement('div');starsDiv.className='result-stars';
    for(let i=0;i<5;i++){const s=document.createElement('span');s.className='s';s.textContent='★';s.style.color='#f0c060';s.style.setProperty('--d',(i*.08)+'s');starsDiv.appendChild(s)}
    const nameDiv=document.createElement('div');nameDiv.className='result-name';nameDiv.style.color='#f5e0b0';nameDiv.textContent=item.name;
    const closeBtn=document.createElement('button');closeBtn.className='result-close';closeBtn.textContent='点 击 继 续';
    card.appendChild(starsDiv);card.appendChild(nameDiv);overlay.appendChild(card);overlay.appendChild(closeBtn);container.appendChild(overlay);
    burstSparks(window.innerWidth/2,window.innerHeight/2);
    function close(){overlay.style.opacity='0';overlay.style.transition='opacity .2s';setTimeout(()=>overlay.remove(),200)}
    closeBtn.addEventListener('click',close);overlay.addEventListener('click',e=>{if(e.target===overlay)close()});
  }

  function singlePull(){
    if(pool.length===0){alert('请先在卡池配置中填入选项！');return}
    const orbit=document.getElementById('wishOrbit');orbit.classList.add('charging');spawnShootingStar();
    setTimeout(()=>{orbit.classList.remove('charging');const result=gachaRoll();if(result){const rect=orbit.getBoundingClientRect();showResult(result,rect.left+rect.width/2,rect.top+rect.height/2);totalPulls++;updateCounters()}},900);
  }

  document.getElementById('wishOrbit').addEventListener('click',singlePull);
  document.getElementById('btnSingle').addEventListener('click',singlePull);

  // Config toggle
  document.getElementById('configToggle').addEventListener('click',()=>{const p=document.getElementById('configPanel'),t=document.getElementById('configToggle');const is=p.classList.toggle('hidden');t.textContent=is?'⚙ 卡池配置 ▾':'⚙ 卡池配置 ▴'});

  document.getElementById('btnApply').addEventListener('click',()=>{applyPool();document.getElementById('configPanel').classList.add('hidden');document.getElementById('configToggle').textContent='⚙ 卡池配置 ▾'});

  document.getElementById('btnLoadMilkTea').addEventListener('click',()=>{document.querySelector('.mode-tab[data-mode="equal"]').click();$equalTA.value='喜茶\n奈雪的茶\n霸王茶姬\n茶颜悦色\n蜜雪冰城\n古茗\n瑞幸咖啡\n星巴克\n一点点\n茶百道\n沪上阿姨\nCoco都可\n书亦烧仙草\n柠季\n爷爷不泡茶';renderEqualTags();applyPool()});
  document.getElementById('btnLoadFood').addEventListener('click',()=>{document.querySelector('.mode-tab[data-mode="equal"]').click();$equalTA.value='火锅\n烧烤\n日料\n韩式烤肉\n川菜\n湘菜\n粤菜\n西北菜\n麻辣烫\n米线\n汉堡\n披萨\n酸菜鱼\n小龙虾\n沙县小吃\n黄焖鸡\n螺蛳粉\n兰州拉面\n饺子\n炸鸡';renderEqualTags();applyPool()});
  document.getElementById('btnLoadDemo').addEventListener('click',()=>{document.querySelector('.mode-tab[data-mode="custom"]').click();$weightList.innerHTML='';[['特等奖 · iPhone',5],['一等奖 · AirPods',10],['二等奖 · 蓝牙音箱',20],['三等奖 · 充电宝',30],['参与奖 · 贴纸',35]].forEach(([n,w])=>addWeightRow(n,w))});
  document.getElementById('btnLoadSimple').addEventListener('click',()=>{document.querySelector('.mode-tab[data-mode="equal"]').click();$equalTA.value='方案A · 团建\n方案B · 聚餐\n方案C · 出游\n方案D · 轰趴\n方案E · 看电影\n张三\n李四\n王五\n赵六\n陈七';renderEqualTags()});

  // Presets
  const PRESET_KEY='gacha_presets',AUTO_KEY='gacha_auto',LAST_KEY='gacha_last_mode';
  function getPresets(){try{return JSON.parse(localStorage.getItem(PRESET_KEY))||[]}catch(e){return[]}}
  function savePresets(ps){localStorage.setItem(PRESET_KEY,JSON.stringify(ps))}
  function serializeConfig(){return{mode:gachaMode,equal:$equalTA.value,custom:[...$weightList.querySelectorAll('.weight-row')].map(row=>({name:row.querySelector('input[type="text"]').value,weight:parseInt(row.querySelector('input[type="range"]').value)||0}))}}
  function deserializeConfig(data){if(data.equal!==undefined)$equalTA.value=data.equal||'';renderEqualTags();$weightList.innerHTML='';if(data.custom?.length)data.custom.forEach(r=>addWeightRow(r.name,r.weight));const tab=document.querySelector(`.mode-tab[data-mode="${data.mode||'equal'}"]`);if(tab)tab.click()}
  function renderPresets(){const list=document.getElementById('presetList'),presets=getPresets(),labels={equal:'均等',custom:'权重'};if(!presets.length){list.innerHTML='<span class="panel-hint">暂无方案</span>';return}list.innerHTML=presets.map((p,i)=>`<div class="preset-chip" data-idx="${i}" title="点击加载"><span class="preset-mode-badge">${labels[p.data.mode]||'?'}</span>${p.name}<span class="preset-del" data-idx="${i}" title="删除">×</span></div>`).join('');list.querySelectorAll('.preset-chip').forEach(chip=>{chip.addEventListener('click',e=>{if(e.target.classList.contains('preset-del'))return;const ps=getPresets(),idx=parseInt(chip.dataset.idx);if(ps[idx]){deserializeConfig(ps[idx].data);applyPool();document.getElementById('configToggle').click()}})});list.querySelectorAll('.preset-del').forEach(btn=>{btn.addEventListener('click',e=>{e.stopPropagation();const ps=getPresets();ps.splice(parseInt(btn.dataset.idx),1);savePresets(ps);renderPresets()})})}
  document.getElementById('btnSavePreset').addEventListener('click',()=>{const name=document.getElementById('presetNameInput').value.trim();if(!name){alert('请输入方案名');return}const ps=getPresets(),exist=ps.findIndex(p=>p.name===name),entry={name,data:serializeConfig(),savedAt:new Date().toISOString()};if(exist>=0)ps[exist]=entry;else ps.push(entry);savePresets(ps);document.getElementById('presetNameInput').value='';renderPresets()});
  function saveLastConfig(){try{localStorage.setItem(AUTO_KEY,JSON.stringify(serializeConfig()))}catch(e){}}
  function restoreLastConfig(){try{const s=JSON.parse(localStorage.getItem(AUTO_KEY));if(s){deserializeConfig(s);return true}}catch(e){}return false}
  function saveLastMode(){localStorage.setItem(LAST_KEY,gachaMode)}

  function loadDefaults(){
    $equalTA.value='方案A · 团建\n方案B · 聚餐\n方案C · 出游\n方案D · 轰趴\n方案E · 看电影\n张三\n李四\n王五\n赵六\n陈七';renderEqualTags();
    [['方案A · 团建',30],['方案B · 聚餐',25],['方案C · 出游',20],['方案D · 轰趴',15],['方案E · 看电影',10]].forEach(([n,w])=>addWeightRow(n,w));
  }
  function init(){const has=restoreLastConfig();if(!$equalTA.value.trim())loadDefaults();applyPool();updateCounters();renderPresets();const lm=localStorage.getItem(LAST_KEY);if(lm&&['equal','custom'].includes(lm)){const tab=document.querySelector(`.mode-tab[data-mode="${lm}"]`);if(tab)tab.click()}}
  document.querySelectorAll('.mode-tab').forEach(b=>b.addEventListener('click',()=>setTimeout(updateModeHint,50)));
  $equalTA.addEventListener('input',()=>setTimeout(updateModeHint,200));
  init();
</script>
</body>
</html>
